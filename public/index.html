<!DOCTYPE html>
<html lang="en">
<head>
  <title>Phone Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080808;
      color: #d8d8d8;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    :root {
      --bg: #141414;
      --button: #050505;
      --button-soft: #0b0b0b;
      --button-active: #1f1f1f;
      --outline: #3a3a3a;
      --text: #d5d5d5;
      --muted: #7f7f7f;

      --unit: min(1vw, 1.75vh);
      --round: clamp(0.8rem, 1.6vw, 2rem);
    }

    .controller {
      position: relative;
      width: min(100dvw, calc(100dvh * 2.18));
      height: min(100dvh, calc(100dvw / 2.18));
      background: radial-gradient(circle at center, #181818, #0d0d0d 70%);
      border-radius: clamp(1rem, 2vw, 2rem);
      overflow: hidden;
    }

    .control {
      position: absolute;
      border: none;
      background: linear-gradient(145deg, #0c0c0c, #020202);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        inset 0 0 0 0.08em rgba(255, 255, 255, 0.08),
        0 0.45em 1.1em rgba(0, 0, 0, 0.65);
    }

    .control.active {
      transform: scale(0.92);
      background: linear-gradient(145deg, #2b2b2b, #080808);
      box-shadow:
        inset 0 0 1.2em rgba(255, 255, 255, 0.08),
        0 0.2em 0.6em rgba(0, 0, 0, 0.85);
    }

    .round-btn {
      border-radius: 50%;
      font-size: clamp(1.3rem, 4vw, 4rem);
    }

    .small-icon {
      width: 5.2%;
      aspect-ratio: 1;
      border-radius: 50%;
      font-size: clamp(1rem, 2.6vw, 2.5rem);
      color: #b8b8b8;
      background: transparent;
      box-shadow: none;
    }

    .small-icon.active {
      background: #161616;
    }

    .label-button {
      width: 8%;
      aspect-ratio: 1;
      border-radius: 50%;
      font-size: clamp(1.2rem, 4.4vw, 4.2rem);
      color: #d0d0d0;
    }

    .bumper {
      width: 8%;
      aspect-ratio: 1;
      border-radius: 50%;
      font-size: clamp(1rem, 3.5vw, 3.8rem);
    }

    .stick-area {
      width: 17.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #050505;
      border: clamp(0.18rem, 0.45vw, 0.55rem) solid var(--outline);
      box-shadow:
        inset 0 0 1.2em rgba(255, 255, 255, 0.04),
        0 0.7em 1.3em rgba(0, 0, 0, 0.6);
    }

    .stick-knob {
      width: 46%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #1d1d1d, #030303 70%);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        inset 0 0 0.7em rgba(255, 255, 255, 0.08),
        0 0.35em 0.7em rgba(0, 0, 0, 0.8);
    }

    .dpad {
      position: absolute;
      left: 13.2%;
      top: 8.3%;
      width: 18%;
      aspect-ratio: 1;
    }

    .dpad button {
      position: absolute;
      width: 36%;
      height: 36%;
      border: none;
      background: linear-gradient(145deg, #0c0c0c, #010101);
      color: transparent;
      box-shadow:
        inset 0 0 0 0.08em rgba(255, 255, 255, 0.08),
        0 0.45em 1em rgba(0, 0, 0, 0.6);
    }

    .dpad button.active {
      transform: scale(0.92);
      background: #252525;
    }

    .dpad-up {
      left: 32%;
      top: 0;
      border-radius: 28% 28% 42% 42%;
    }

    .dpad-down {
      left: 32%;
      bottom: 0;
      border-radius: 42% 42% 28% 28%;
    }

    .dpad-left {
      left: 0;
      top: 32%;
      border-radius: 28% 42% 42% 28%;
    }

    .dpad-right {
      right: 0;
      top: 32%;
      border-radius: 42% 28% 28% 42%;
    }

    .action-cluster {
      position: absolute;
      right: 5.2%;
      bottom: 7%;
      width: 22%;
      aspect-ratio: 1;
    }

    .action-cluster .round-btn {
      width: 30%;
      aspect-ratio: 1;
      font-size: clamp(1.1rem, 4.5vw, 4.5rem);
    }

    .action-y {
      left: 35%;
      top: 0;
    }

    .action-x {
      left: 0;
      top: 35%;
    }

    .action-b {
      right: 0;
      top: 35%;
    }

    .action-a {
      left: 35%;
      bottom: 0;
    }

    .top-settings {
      left: 34.5%;
      top: 4.7%;
    }

    .top-circle-1 {
      left: 43.6%;
      top: 4.7%;
    }

    .top-circle-2 {
      left: 52.6%;
      top: 4.7%;
    }

    .top-wireless {
      left: 61.5%;
      top: 4.7%;
      opacity: 0.45;
    }

    .mid-left {
      left: 36.7%;
      top: 32.5%;
    }

    .mid-home {
      left: 47.1%;
      top: 32.5%;
      outline: clamp(0.12rem, 0.28vw, 0.35rem) solid var(--outline);
      outline-offset: -0.45em;
    }

    .mid-right {
      left: 57.5%;
      top: 32.5%;
    }

    .left-stick {
      left: 4.5%;
      bottom: 7%;
    }

    .right-stick {
      right: 16.2%;
      top: 9%;
    }

    .ls {
      left: 2.8%;
      top: 32.5%;
    }

    .rs {
      right: 4.6%;
      top: 32.5%;
    }

    .lb {
      left: 23.7%;
      bottom: 28.4%;
    }

    .lt {
      left: 23.7%;
      bottom: 6.3%;
    }

    .rb {
      right: 27.5%;
      bottom: 28.4%;
    }

    .rt {
      right: 27.5%;
      bottom: 6.3%;
    }

    .status {
      position: absolute;
      left: 1.2%;
      top: 1.4%;
      font-size: clamp(0.65rem, 1.3vw, 1rem);
      color: #666;
      z-index: 10;
    }

    .rotate-hint {
      display: none;
    }

    @media (orientation: portrait) {
      .controller {
        width: 100dvw;
        height: 100dvh;
        border-radius: 0;
      }

      .rotate-hint {
        display: flex;
        position: absolute;
        inset: 0;
        z-index: 100;
        background: #080808;
        color: #ddd;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        font-size: clamp(1.1rem, 5vw, 2rem);
      }
    }

    @media (max-aspect-ratio: 1.8/1) and (orientation: landscape) {
      .action-cluster {
        right: 3%;
        width: 20%;
      }

      .dpad {
        left: 11.5%;
        width: 17%;
      }

      .left-stick {
        left: 3.5%;
      }

      .right-stick {
        right: 15%;
      }

      .lb,
      .lt {
        left: 24.5%;
      }

      .rb,
      .rt {
        right: 28.5%;
      }
    }
  </style>
</head>

<body>
  <main class="controller">
    <div class="status" id="status">Connecting...</div>

    <div class="rotate-hint">
      Rotate your phone sideways for the controller layout.
    </div>

    <section class="dpad">
      <button class="dpad-up control-pad" data-action="up"></button>
      <button class="dpad-left control-pad" data-action="left"></button>
      <button class="dpad-right control-pad" data-action="right"></button>
      <button class="dpad-down control-pad" data-action="down"></button>
    </section>

    <button class="control small-icon top-settings" data-action="settings">⚙</button>
    <button class="control small-icon top-circle-1" data-action="select">○</button>
    <button class="control small-icon top-circle-2" data-action="start">○</button>
    <button class="control small-icon top-wireless" data-action="wireless">⌁</button>

    <button class="control small-icon mid-left" data-action="back">←</button>
    <button class="control small-icon mid-home" data-action="home">⟳</button>
    <button class="control small-icon mid-right" data-action="play">▶</button>

    <button class="control label-button ls" data-action="ls_button">LS</button>
    <button class="control label-button rs" data-action="rs_button">RS</button>

    <button class="control bumper lb" data-action="lb">LB</button>
    <button class="control bumper lt" data-action="lt">LT</button>
    <button class="control bumper rb" data-action="rb">RB</button>
    <button class="control bumper rt" data-action="rt">RT</button>

    <div class="control stick-area left-stick" data-stick="left">
      <div class="stick-knob"></div>
    </div>

    <div class="control stick-area right-stick" data-stick="right">
      <div class="stick-knob"></div>
    </div>

    <section class="action-cluster">
      <button class="control round-btn action-y" data-action="y">Y</button>
      <button class="control round-btn action-x" data-action="x">X</button>
      <button class="control round-btn action-b" data-action="b">B</button>
      <button class="control round-btn action-a" data-action="a">A</button>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const statusText = document.getElementById("status");
    const pressedButtons = new Set();

    socket.on("connect", () => {
      statusText.textContent = "Connected";
    });

    socket.on("disconnect", () => {
      statusText.textContent = "Disconnected";
    });

    function emitControl(action, state) {
      socket.emit("control", {
        type: "button",
        action,
        state,
        pressed: Array.from(pressedButtons),
        time: Date.now()
      });
    }

    function pressButton(button, pointerId) {
      const action = button.dataset.action;

      if (!action) return;

      try {
        button.setPointerCapture(pointerId);
      } catch {}

      if (!pressedButtons.has(action)) {
        pressedButtons.add(action);
        button.classList.add("active");
        emitControl(action, "pressed");
      }
    }

    function releaseButton(button) {
      const action = button.dataset.action;

      if (!action) return;

      if (pressedButtons.has(action)) {
        pressedButtons.delete(action);
        button.classList.remove("active");
        emitControl(action, "released");
      }
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        pressButton(button, event.pointerId);
      });

      button.addEventListener("pointerup", (event) => {
        event.preventDefault();
        releaseButton(button);
      });

      button.addEventListener("pointercancel", (event) => {
        event.preventDefault();
        releaseButton(button);
      });

      button.addEventListener("lostpointercapture", () => {
        releaseButton(button);
      });
    });

    function setupStick(stick) {
      const knob = stick.querySelector(".stick-knob");
      const stickName = stick.dataset.stick;
      let activePointer = null;

      function sendStick(x, y) {
        socket.emit("control", {
          type: "stick",
          stick: stickName,
          x,
          y,
          time: Date.now()
        });
      }

      function moveStick(event) {
        if (activePointer !== event.pointerId) return;

        const rect = stick.getBoundingClientRect();
        const radius = rect.width / 2;
        const centerX = rect.left + radius;
        const centerY = rect.top + radius;

        let dx = event.clientX - centerX;
        let dy = event.clientY - centerY;

        const distance = Math.hypot(dx, dy);
        const maxDistance = radius * 0.48;

        if (distance > maxDistance) {
          dx = (dx / distance) * maxDistance;
          dy = (dy / distance) * maxDistance;
        }

        const normalizedX = +(dx / maxDistance).toFixed(2);
        const normalizedY = +(-dy / maxDistance).toFixed(2);

        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        stick.classList.add("active");

        sendStick(normalizedX, normalizedY);
      }

      function resetStick() {
        activePointer = null;
        knob.style.transform = "translate(-50%, -50%)";
        stick.classList.remove("active");
        sendStick(0, 0);
      }

      stick.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        activePointer = event.pointerId;

        try {
          stick.setPointerCapture(event.pointerId);
        } catch {}

        moveStick(event);
      });

      stick.addEventListener("pointermove", (event) => {
        event.preventDefault();
        moveStick(event);
      });

      stick.addEventListener("pointerup", (event) => {
        event.preventDefault();
        if (activePointer === event.pointerId) resetStick();
      });

      stick.addEventListener("pointercancel", (event) => {
        event.preventDefault();
        if (activePointer === event.pointerId) resetStick();
      });

      stick.addEventListener("lostpointercapture", resetStick);
    }

    document.querySelectorAll("[data-stick]").forEach(setupStick);

    window.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
  </script>
</body>
</html>
